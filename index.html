    <script>
      // Undo the 404.html SPA fallback redirect (GitHub Pages deep links).
      // "/repo/?/about" -> "/repo/about" so react-router sees the real route.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) { return s.replace(/~and~/g, "&"); })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
